<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión Financiera - Lazo Arce</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <noscript>Necesitas habilitar JavaScript para ejecutar esta aplicación.</noscript>
    <div id="root"></div>

    <!-- 1. Cargar React y ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

    <!-- 2. Cargar Babel para transpilar JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 3. Cargar nuestros componentes de React (el type="text/babel" es crucial) -->
    <script type="text/babel" src="LoginScreen.js"></script>
    <script type="text/babel" src="ProductList.js"></script>
    <script type="text/babel" src="LoanSimulator.js"></script>
    <script type="text/babel" src="MyApplications.js"></script>
    <script type="text/babel" src="Profile.js"></script>
    <script type="text/babel" src="ContractView.js"></script>
    <script type="text/babel" src="JournalView.js"></script>
    <script type="text/babel" src="PaymentHistory.js"></script>
    <script type="text/babel" src="EmployeeManagement.js"></script>
    <script type="text/babel" src="PayrollView.js"></script>
    <script type="text/babel" src="Navbar.js"></script>
    <script type="text/babel" src="App.js"></script>

    <!-- 4. Renderizar la aplicación en el DOM -->
    <script type="text/babel">
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
