<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 LAZOARCE UBMS | Universal Business Management System v2.1</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        #root { 
            max-width: 1400px; 
            margin: 0 auto; 
            background: white; 
            border-radius: 12px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        nav { 
            background: linear-gradient(90deg, #1e3a8a, #3b82f6); 
            padding: 1rem; 
            display: flex; 
            flex-wrap: wrap; 
            gap: 0.5rem; 
            overflow-x: auto;
        }
        nav button { 
            padding: 0.75rem 1.5rem; 
            border: none; 
            border-radius: 8px; 
            background: rgba(255,255,255,0.2); 
            color: white; 
            cursor: pointer; 
            font-weight: 500;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        nav button:hover { 
            background: rgba(255,255,255,0.3); 
            transform: translateY(-2px);
        }
        h1 { 
            background: linear-gradient(90deg, #1e3a8a, #3b82f6, #10b981); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            background-clip: text;
            text-align: center; 
            margin: 0; 
            padding: 2rem; 
            font-size: 2.5rem; 
            font-weight: 800;
        }
        main { padding: 2rem; }
        .module-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; margin-top: 2rem; }
        .module-card { 
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); 
            border: 1px solid #e2e8f0; 
            border-radius: 12px; 
            padding: 1.5rem; 
            transition: all 0.3s ease; 
            cursor: pointer;
        }
        .module-card:hover { 
            transform: translateY(-4px); 
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); 
            border-color: #3b82f6;
        }
        .module-icon { font-size: 3rem; display: block; text-align: center; margin-bottom: 1rem; }
        @media (max-width: 768px) { 
            body { padding: 10px; } 
            nav { padding: 0.5rem; gap: 0.25rem; } 
            nav button { padding: 0.5rem 1rem; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>const API_BASE_URL = 'http://127.0.0.1:5001';</script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- CORE MODULES -->
    <script type="text/babel" src="Auth.js"></script>

    <script type="text/babel" src="AdminDashboard.js"></script>
    <script type="text/babel" src="ContractView.js"></script>
    <script type="text/babel" src="JournalView.js"></script>
    <script type="text/babel" src="GeneralLedgerView.js"></script>
    <script type="text/babel" src="EmployeeManagement.js"></script>
    <script type="text/babel" src="PayrollView.js"></script>
    <script type="text/babel" src="ProfileView.js"></script>
    <script type="text/babel" src="TrialBalanceView.js"></script>
    <script type="text/babel" src="BalanceSheetView.js"></script>
    <script type="text/babel" src="IncomeStatementView.js"></script>
    <script type="text/babel" src="PaySlipsView.js"></script>
    <script type="text/babel" src="LeadManagementView.js"></script>
    <script type="text/babel" src="PaymentView.js"></script>
    <script type="text/babel" src="PortfolioView.js"></script>
    <script type="text/babel" src="LoanStatementView.js"></script>
    <script type="text/babel" src="TemplateManagerView.js"></script>
    <script type="text/babel" src="AuditLogView.js"></script>
    <script type="text/babel" src="TestingView.js"></script>
    <script type="text/babel" src="OpportunityPipelineView.js"></script>
    <script type="text/babel" src="MailingListView.js"></script>
    <script type="text/babel" src="CampaignView.js"></script>
    <script type="text/babel" src="ClientTicketsView.js"></script>

    <!-- LAN MODULES (7/7 COMPLETOS) -->
    <script type="text/babel" src="components/SchoolManagementView.js"></script>

    <!-- MAIN APP -->

    <script type="text/babel">
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
