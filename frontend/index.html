<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión Financiera - Lazo Arce</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="root"></div>

    <!-- Global Config -->
    <script>const API_BASE_URL = 'http://127.0.0.1:5001';</script>

    <!-- React Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- App Components -->
    <script type="text/babel" src="Login.js"></script>
    <script type="text/babel" src="LoanProducts.js"></script>
    <script type="text/babel" src="LoanApplicationForm.js"></script>
    <script type="text/babel" src="MyApplications.js"></script>
    <script type="text/babel" src="LoanDetailView.js"></script>

    <script type="text/babel" src="Profile.js"></script>
    <script type="text/babel" src="GeneralLedgerView.js"></script>
    <script type="text/babel" src="EmployeeManagement.js"></script>
    <script type="text/babel" src="PayrollView.js"></script>
    <script type="text/babel" src="App.js"></script>

    <!-- Render App -->
    <script type="text/babel">
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
