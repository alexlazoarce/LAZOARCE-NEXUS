name: Python Package using Conda

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: '3.10'
    - name: Add conda to system path
      run: |
        # $CONDA is an environment variable pointing to the root of the miniconda directory
        echo $CONDA/bin >> $GITHUB_PATH
    - name: Create Conda environment
      run: conda env create -f environment.yml
    - name: Lint with flake8
      run: |
        conda run -n prestamos-backend flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        conda run -n prestamos-backend flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: conda run -n prestamos-backend pytest
