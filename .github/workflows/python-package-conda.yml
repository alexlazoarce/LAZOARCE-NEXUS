name: Python Package using Conda

on: 

  push:

    branches: [ main, develop ]

    paths-ignore:

      - '**.md'

      - 'docs/**'

  pull_request:

    branches: [ main, develop ]

    paths-ignore:

      - '**.md'

      - 'docs/**'

concurrency:

  group: ${{ github.workflow }}-${{ github.ref }}

  cancel-in-progress: true

jobs:

  build:

    name: Build & Test

    runs-on: ubuntu-latest

    strategy:

      matrix:

        python-version: ["3.10"]  # Fixed to 3.10 (matches environment.yml)

    

    steps:

    - name: Checkout code

      uses: actions/checkout@v4

      with:

        fetch-depth: 0

    - name: Set up Miniconda

      uses: conda-incubator/setup-miniconda@v3

      with:

        activate-environment: prestamos-backend

        environment-file: environment.yml

        python-version: ${{ matrix.python-version }}

        auto-activate-base: false

        miniforge-variant: Mambaforge

        channels: conda-forge

        channel-priority: strict

        use-only-tar-bz2: true

    - name: Cache conda packages

      uses: actions/cache@v4

      with:

        path: |

          $CONDA/envs/prestamos-backend

          $CONDA/pkgs/*

        key: ${{ runner.os }}-conda-${{ matrix.python-version }}-${{ hashFiles('environment.yml') }}

        restore-keys: |

          ${{ runner.os }}-conda-${{ matrix.python-version }}-

    - name: Verify conda environment

      shell: bash -l {0}

      run: |

        conda info

        conda list

        which python

        python --version

        pip list

    - name: Lint with flake8

      shell: bash -l {0}

      run: |

        # Strict linting (fails on errors)

        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

        

        # Full linting (doesn't fail build)

        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Lint with black (check formatting)

      shell: bash -l {0}

      run: |

        black --check --diff .

    - name: Lint with isort (check imports)

      shell: bash -l {0}

      run: |

        isort . --check-only --diff

    - name: Type checking with mypy

      shell: bash -l {0}

      run: |

        mypy . --non-interactive || true

    - name: Test with pytest

      shell: bash -l {0}

      env:

        DATABASE_URL: sqlite:///./test.db

        SECRET_KEY: test-secret-key

        TESTING: True

      run: |

        pytest -v --cov=backend --cov-report=term-missing

    - name: Security audit with bandit

      shell: bash -l {0}

      run: |

        bandit -r backend/ -f json -o bandit-report.json || true

  build-docker:

    name: Build Docker image

    runs-on: ubuntu-latest

    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    

    steps:

    - name: Checkout code

      uses: actions/checkout@v4

    - name: Set up Docker Buildx

      uses: docker/setup-buildx-action@v3

    - name: Login to DockerHub

      uses: docker/login-action@v3

      with:

        username: ${{ secrets.DOCKERHUB_USERNAME }}

        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image

      uses: docker/build-push-action@v6

      with:

        context: .

        push: true

        tags: |

          ${{ secrets.DOCKERHUB_USERNAME }}/prestamos-backend:latest

          ${{ secrets.DOCKERHUB_USERNAME }}/prestamos-backend:${{ github.sha }}

        cache-from: type=gha

        cache-to: type=gha,mode=max

  deploy-staging:

    name: Deploy to Staging

    runs-on: ubuntu-latest

    needs: [build]

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    

    steps:

    - name: Deploy to staging server

      env:

        DEPLOY_SERVER: ${{ secrets.STAGING_SERVER }}

        DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}

      run: |

        echo "$DEPLOY_KEY" > deploy_key

        chmod 600 deploy_key

        

        ssh -i deploy_key -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_SERVER << 'EOF'

          cd /opt/prestamos-backend

          git pull origin develop

          docker-compose pull

          docker-compose up -d

          docker system prune -f

        EOF

  deploy-production:

    name: Deploy to Production

    runs-on: ubuntu-latest

    needs: [build, build-docker]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    

    steps:

    - name: Deploy to production server

      env:

        DEPLOY_SERVER: ${{ secrets.PRODUCTION_SERVER }}

        DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}

      run: |

        echo "$DEPLOY_KEY" > deploy_key

        chmod 600 deploy_key

        

        ssh -i deploy_key -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_SERVER << 'EOF'

          cd /opt/prestamos-backend

          git pull origin main

          docker-compose pull

          docker-compose up -d

          docker system prune -f

        EOF

  quality-gate:

    name: Quality Gate

    runs-on: ubuntu-latest

    needs: [build]

    if: always()

    

    steps:

    - name: Check build status

      run: |

        if [ "${{ needs.build.result }}" != 'success' ]; then

          echo "❌ Build failed - Quality gate failed"

          exit 1

        fi

        echo "✅ All checks passed - Quality gate passed"