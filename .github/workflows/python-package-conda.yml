name: Python Package using Conda

on: 

  push:

    branches: [ main, develop ]

    paths-ignore:

      - '**.md'

      - 'docs/**'

  pull_request:

    branches: [ main, develop ]

    paths-ignore:

      - '**.md'

      - 'docs/**'

concurrency:

  group: ${{ github.workflow }}-${{ github.ref }}

  cancel-in-progress: true

jobs:

  build:

    name: Build & Test

    runs-on: ubuntu-latest

    strategy:

      matrix:

        python-version: ["3.10"]  # Fixed to 3.10 (matches environment.yml)

    

    steps:

    - name: Checkout code

      uses: actions/checkout@v4

      with:

        fetch-depth: 0

    - name: Set up Miniconda

      uses: conda-incubator/setup-miniconda@v3

      with:

        activate-environment: prestamos-backend

        environment-file: environment.yml

        python-version: ${{ matrix.python-version }}

        auto-activate-base: false

        miniforge-variant: Mambaforge

        channels: conda-forge

        channel-priority: strict

        use-only-tar-bz2: true

    - name: Cache conda packages

      uses: actions/cache@v4

      with:

        path: |

          $CONDA/envs/prestamos-backend

          $CONDA/pkgs/*

        key: ${{ runner.os }}-conda-${{ matrix.python-version }}-${{ hashFiles('environment.yml') }}

        restore-keys: |

          ${{ runner.os }}-conda-${{ matrix.python-version }}-

    - name: Verify conda environment

      shell: bash -l {0}

      run: |

        conda info

        conda list

        which python

        python --version

        pip list

    - name: Lint with flake8

      shell: bash -l {0}

      run: |

        # Strict linting (fails on errors)

        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

        

        # Full linting (doesn't fail build)

        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Lint with black (check formatting)

      shell: bash -l {0}

      run: |

        black --check --diff .

    - name: Lint with isort (check imports)

      shell: bash -l {0}

      run: |

        isort . --check-only --diff

    - name: Type checking with mypy

      shell: bash -l {0}

      run: |

        mypy . --non-interactive

    - name: Test with pytest

      shell: bash -l {0}

      env:

        DATABASE_URL: sqlite:///./test.db

        SECRET_KEY: test-secret-key

        TESTING: True

      run: |

        # Generate coverage report

        pytest -v --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=70

    - name: Security audit with bandit

      shell: bash -l {0}

      run: |

        bandit -r . -f json -o bandit-report.json || true

    - name: Upload coverage reports

      uses: codecov/codecov-action@v4

      with:

        file: ./coverage.xml

        fail_ci_if_error: false

    - name: Upload test artifacts

      if: always()

      uses: actions/upload-artifact@v4

      with:

        name: test-results

        path: |

          coverage.xml

          bandit-report.json

          .coverage

  build-docker:

    name: Build Docker image

    runs-on: ubuntu-latest

    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    

    steps:

    - name: Checkout code

      uses: actions/checkout@v4

    - name: Set up Docker Buildx

      uses: docker/setup-buildx-action@v3

    - name: Login to DockerHub

      uses: docker/login-action@v3

      with:

        username: ${{ secrets.DOCKERHUB_USERNAME }}

        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image

      uses: docker/build-push-action@v6

      with:

        context: .

        file: ./Dockerfile

        push: true

        tags: |

          ${{ secrets.DOCKERHUB_USERNAME }}/prestamos-backend:latest

          ${{ secrets.DOCKERHUB_USERNAME }}/prestamos-backend:${{ github.sha }}

          ${{ secrets.DOCKERHUB_USERNAME }}/prestamos-backend:${{ github.ref_name }}

        cache-from: type=gha

        cache-to: type=gha,mode=max

    - name: Inspect Docker image

      run: |

        docker run --rm ${{ secrets.DOCKERHUB_USERNAME }}/prestamos-backend:${{ github.sha }} \

          curl -f http://localhost:5000/api/health || exit 1

  deploy-staging:

    name: Deploy to Staging

    runs-on: ubuntu-latest

    needs: [build]

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    

    steps:

    - name: Checkout code

      uses: actions/checkout@v4

    - name: Deploy to staging server

      env:

        DEPLOY_SERVER: ${{ secrets.STAGING_SERVER }}

        DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}

      run: |

        echo "$DEPLOY_KEY" > deploy_key

        chmod 600 deploy_key

        

        ssh -i deploy_key -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_SERVER << 'EOF'

          set -e  # Exit on any error

          

          # Ensure directory exists

          cd /opt/prestamos-backend || { mkdir -p /opt/prestamos-backend && cd /opt/prestamos-backend; }

          

          # Backup current deployment

          if [ -f "docker-compose.yml" ]; then

            cp docker-compose.yml docker-compose.yml.backup.$(date +%Y%m%d_%H%M%S)

          fi

          

          # Pull latest code

          git fetch origin

          git checkout develop

          git pull origin develop

          

          # Run database migrations

          docker-compose run --rm backend flask db upgrade

          

          # Pull and restart services

          docker-compose pull

          docker-compose up -d

          

          # Cleanup

          docker system prune -f

          docker image prune -f

          

          # Health check

          sleep 10

          if ! docker-compose ps | grep -q "Up"; then

            echo "❌ Services failed to start"

            docker-compose logs backend

            exit 1

          fi

          

          echo "✅ Staging deployment successful"

        EOF

    - name: Post-deployment health check

      env:

        DEPLOY_SERVER: ${{ secrets.STAGING_SERVER }}

        DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}

      run: |

        echo "$DEPLOY_KEY" > deploy_key

        chmod 600 deploy_key

        

        ssh -i deploy_key -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_SERVER << 'EOF'

          cd /opt/prestamos-backend

          # Wait for services to be ready

          for i in {1..30}; do

            if curl -f http://localhost:5000/api/health >/dev/null 2>&1; then

              echo "✅ Health check passed"

              exit 0

            fi

            echo "Waiting for service... ($i/30)"

            sleep 2

          done

          echo "❌ Health check failed after 60 seconds"

          docker-compose logs backend

          exit 1

        EOF

  deploy-production:

    name: Deploy to Production

    runs-on: ubuntu-latest

    needs: [build, build-docker]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    

    steps:

    - name: Checkout code

      uses: actions/checkout@v4

    - name: Deploy to production server

      env:

        DEPLOY_SERVER: ${{ secrets.PRODUCTION_SERVER }}

        DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}

      run: |

        echo "$DEPLOY_KEY" > deploy_key

        chmod 600 deploy_key

        

        ssh -i deploy_key -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_SERVER << 'EOF'

          set -e  # Exit on any error

          

          # Ensure directory exists

          cd /opt/prestamos-backend || { mkdir -p /opt/prestamos-backend && cd /opt/prestamos-backend; }

          

          # Backup current deployment

          if [ -f "docker-compose.yml" ]; then

            cp docker-compose.yml docker-compose.yml.backup.$(date +%Y%m%d_%H%M%S)

          fi

          

          # Pull latest code

          git fetch origin

          git checkout main

          git pull origin main

          

          # Run database migrations

          docker-compose run --rm backend flask db upgrade

          

          # Pull latest images and restart

          docker-compose pull

          docker-compose up -d

          

          # Cleanup old images

          docker system prune -f

          docker image prune -f

          

          # Health check

          sleep 15

          if ! docker-compose ps | grep -q "Up"; then

            echo "❌ Services failed to start"

            docker-compose logs backend

            exit 1

          fi

          

          echo "✅ Production deployment successful"

        EOF

    - name: Post-deployment health check

      env:

        DEPLOY_SERVER: ${{ secrets.PRODUCTION_SERVER }}

        DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}

      run: |

        echo "$DEPLOY_KEY" > deploy_key

        chmod 600 deploy_key

        

        ssh -i deploy_key -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_SERVER << 'EOF'

          cd /opt/prestamos-backend

          # Wait for services to be ready

          for i in {1..30}; do

            if curl -f http://localhost:5000/api/health >/dev/null 2>&1; then

              echo "✅ Health check passed"

              exit 0

            fi

            echo "Waiting for service... ($i/30)"

            sleep 2

          done

          echo "❌ Health check failed after 60 seconds"

          docker-compose logs backend

          exit 1

        EOF

  quality-gate:

    name: Quality Gate

    runs-on: ubuntu-latest

    needs: [build]

    if: always()

    

    steps:

    - name: Check build status

      run: |

        if [ "${{ needs.build.result }}" != 'success' ]; then

          echo "❌ Build failed - Quality gate failed"

          exit 1

        fi

        echo "✅ All checks passed - Quality gate passed"

  notify:

    name: Notify Results

    runs-on: ubuntu-latest

    needs: [quality-gate, deploy-staging, deploy-production, build-docker]

    if: always()

    

    steps:

    - name: Send notification

      uses: 8398a7/action-slack@v3

      with:

        status: ${{ job.status }}

        webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}

        channel: '#deployments'

        text: |

          🚀 **Prestamos Backend CI/CD**

          **Status**: ${{ job.status }}

          **Branch**: ${{ github.ref_name }}

          **Commit**: ${{ github.sha }}

          **Event**: ${{ github.event_name }}

        fields: |

          {title}Job{value}${{ job.status }}{short}true

          {title}Branch{value}${{ github.ref_name }}{short}true

          {title}Repository{value}${{ github.repository }}{short}true

          {title}Commit{value}${{ github.sha }}{short}false