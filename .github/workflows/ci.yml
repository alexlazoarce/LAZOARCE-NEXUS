name: Backend CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v2
        with:
          activate-environment: prestamos-backend
          environment-file: backend/environment.yml
          python-version: 3.12
          auto-update-conda: true

      - name: Verify Environment and Dependencies
        shell: bash -l {0}
        run: |
          echo "Verifying Conda environment..."
          conda info --envs
          echo "Verifying Python version..."
          python --version
          echo "Verifying key dependencies..."
          python -c "import flask; import pandas; import fpdf; import numpy_financial; print('✅ All key libraries imported successfully!')"